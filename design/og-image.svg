<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!--
    Исходник обложки для соцсетей. Из него собирается public/og-image.png —
    именно PNG, потому что Telegram, VK и Facebook не умеют показывать SVG
    в превью ссылки. После правки этого файла пересоберите растр:
      node design/build-og.mjs
  -->
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF8FF"/>
      <stop offset="1" stop-color="#EDE4FD"/>
    </linearGradient>
    <linearGradient id="ot" x1="80" y1="300" x2="900" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og)"/>
  <circle cx="1040" cy="120" r="210" fill="#D946EF" opacity=".13"/>
  <circle cx="1140" cy="480" r="170" fill="#8B5CF6" opacity=".13"/>

  <g transform="translate(80 68) scale(0.62)">
    <path d="M80 0c14 56 40 95 80 118-40 23-66 62-80 118-14-56-40-95-80-118 40-23 66-62 80-118Z" fill="url(#ot)"/>
    <path d="M80 118c14 56 40 95 80 118-40 23-66 62-80 118-14-56-40-95-80-118 40-23 66-62 80-118Z" fill="url(#ot)" opacity=".7"/>
  </g>
  <text x="188" y="176" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#16123A">Pro Нейронки</text>

  <text x="80" y="326" font-family="system-ui, sans-serif" font-size="54" font-weight="800" fill="#16123A">Искусственный интеллект —</text>
  <text x="80" y="396" font-family="system-ui, sans-serif" font-size="54" font-weight="800" fill="url(#ot)">ваш инструмент роста и свободы</text>
  <text x="80" y="474" font-family="system-ui, sans-serif" font-size="27" font-weight="500" fill="#6B6890">Практические курсы по нейросетям · ChatGPT · Claude · Midjourney</text>
</svg>
